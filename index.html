<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      EDIT HERE: page title + link-preview text (WhatsApp / social).
      Names & details shown on the page itself live in src/data/wedding.js.
    -->
    <title>Salman &amp; Safa — Nikkah Invitation</title>
    <meta name="description" content="With the blessings of Allah, you are warmly invited to the Nikkah of Salman &amp; Safa — Sunday, 20 December 2026." />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2a2b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, Facebook, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Salman &amp; Safa — Nikkah Invitation" />
    <meta property="og:description" content="With the blessings of Allah, you are warmly invited to our Nikkah. Tap to open the invitation." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salman &amp; Safa — Nikkah Invitation" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Salman &amp; Safa — Nikkah Invitation" />
    <meta name="twitter:description" content="With the blessings of Allah, you are warmly invited to our Nikkah." />
    <meta name="twitter:image" content="/og.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font load: page paints immediately, fonts swap in -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" /></noscript>

    <!-- instant first paint (before any JS): emerald backdrop + the loader.
         The loader stays up until the whole site (code, fonts, music) is downloaded;
         src/preload.js drives its progress ring and removes it. -->
    <style>
      html,body{margin:0;background:#0a2a2b}
      .boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 42%,#14504f 0%,#0a2a2b 70%);color:#e9cf93;font-family:Georgia,'Times New Roman',serif;transition:opacity .6s ease,visibility .6s;-webkit-tap-highlight-color:transparent}
      .boot.is-done{opacity:0;visibility:hidden;pointer-events:none}
      .bl{position:relative;width:132px;height:132px}
      .bl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
      .bl-track{fill:none;stroke:rgba(212,175,106,.18);stroke-width:2.4}
      .bl-arc{fill:none;stroke:#d4af6a;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:74;transform-origin:60px 60px;transform:rotate(-90deg);transition:stroke-dashoffset .45s ease;filter:drop-shadow(0 0 4px rgba(244,205,120,.55))}
      .boot:not(.is-det) .bl-spin{transform-origin:60px 60px;animation:blspin 1.3s linear infinite}
      .bl-orn{fill:#d4af6a;opacity:.55}
      .bl-mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-style:italic;font-size:34px;letter-spacing:.5px;color:#f1d998;text-shadow:0 0 14px rgba(212,175,106,.35);animation:blbreathe 2.4s ease-in-out infinite}
      .bl-mono i{font-size:22px;opacity:.85}
      .bl-t{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(233,207,147,.85)}
      .bl-t b{display:inline-block;width:1.4em;text-align:left;font-weight:400}
      .bl-t b::after{content:'';animation:bldots 1.4s steps(4) infinite}
      .bl-p{margin:-8px 0 0;font-size:15px;font-variant-numeric:tabular-nums;color:#f1d998;min-height:1.2em}
      .boot:not(.is-det) .bl-p{visibility:hidden}
      @keyframes blspin{to{transform:rotate(360deg)}}
      @keyframes blbreathe{0%,100%{opacity:.8;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
      @keyframes bldots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
      @media (prefers-reduced-motion:reduce){.bl-mono,.bl-spin,.bl-t b::after{animation:none!important}}
    </style>
  </head>
  <body>
    <noscript>Please enable JavaScript to view this invitation.</noscript>
    <div id="root"></div>
    <div id="boot" class="boot" role="status" aria-live="polite" aria-label="Loading the invitation">
      <div class="bl">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g class="bl-orn">
            <path d="M60 -1 l2.4 3.6 -2.4 3.6 -2.4 -3.6z"/><path d="M60 114 l2.4 3.6 -2.4 3.6 -2.4 -3.6z"/>
            <path d="M-1 60 l3.6 -2.4 3.6 2.4 -3.6 2.4z"/><path d="M114 60 l3.6 -2.4 3.6 2.4 -3.6 2.4z"/>
            <circle cx="18.2" cy="18.2" r="1.3"/><circle cx="101.8" cy="18.2" r="1.3"/><circle cx="18.2" cy="101.8" r="1.3"/><circle cx="101.8" cy="101.8" r="1.3"/>
          </g>
          <circle class="bl-track" cx="60" cy="60" r="52"/>
          <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(212,175,106,.28)" stroke-width=".8" stroke-dasharray=".5 3.2" stroke-linecap="round"/>
          <g class="bl-spin"><circle id="boot-arc" class="bl-arc" cx="60" cy="60" r="52" pathLength="100"/></g>
        </svg>
        <div class="bl-mono" aria-hidden="true"><span>S</span><i>&amp;</i><span>S</span></div>
      </div>
      <p class="bl-t">Preparing your invitation<b></b></p>
      <p class="bl-p"><span id="boot-pct">0</span>%</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
