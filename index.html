<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      EDIT HERE: page title + link-preview text (WhatsApp / social).
      Names & details shown on the page itself live in src/data/wedding.js.
    -->
    <title>Salman &amp; Safa — Nikkah Invitation</title>
    <meta name="description" content="With the blessings of Allah, you are warmly invited to the Nikkah of Salman &amp; Safa — Sunday, 20 December 2026." />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2a2b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, Facebook, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Salman &amp; Safa — Nikkah Invitation" />
    <meta property="og:description" content="With the blessings of Allah, you are warmly invited to our Nikkah. Tap to open the invitation." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salman &amp; Safa — Nikkah Invitation" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Salman &amp; Safa — Nikkah Invitation" />
    <meta name="twitter:description" content="With the blessings of Allah, you are warmly invited to our Nikkah." />
    <meta name="twitter:image" content="/og.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font load: page paints immediately, fonts swap in -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" /></noscript>

    <!-- instant first paint (before any JS): emerald backdrop + a hanging Arabic lantern with a flickering flame -->
    <style>
      html,body{margin:0;background:#0a2a2b}
      .boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#14504f 0%,#0a2a2b 70%)}
      .boot svg{width:118px;height:auto;overflow:visible;transform-origin:50% 0;animation:bsway 3.2s ease-in-out infinite}
      .boot .halo{animation:bhalo 1.3s ease-in-out infinite}
      .boot .glass{animation:bglass 1.1s steps(1) infinite}
      .boot .fl{transform-origin:40px 80px;animation:bflk .9s ease-in-out infinite}
      .boot .fl2{transform-origin:40px 80px;animation:bflk .7s ease-in-out infinite reverse}
      @keyframes bsway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
      @keyframes bhalo{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}
      @keyframes bglass{0%,100%{opacity:.85}30%{opacity:.7}55%{opacity:.95}80%{opacity:.78}}
      @keyframes bflk{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.9,1.1) skewX(3deg)}45%{transform:scale(1.06,.92) skewX(-2deg)}70%{transform:scale(.94,1.07) skewX(-3deg)}85%{transform:scale(1.03,.97) skewX(1deg)}}
      .boot .halo{transform-origin:40px 76px}
      @media (prefers-reduced-motion:reduce){.boot svg,.boot .halo,.boot .glass,.boot .fl,.boot .fl2{animation:none}}
    </style>
  </head>
  <body>
    <noscript>Please enable JavaScript to view this invitation.</noscript>
    <div id="root"><div class="boot" aria-hidden="true">
      <svg viewBox="0 0 80 132">
        <defs>
          <radialGradient id="bh"><stop offset="0" stop-color="#ffc861" stop-opacity=".55"/><stop offset="1" stop-color="#ffc861" stop-opacity="0"/></radialGradient>
          <radialGradient id="bg" cx=".5" cy=".62" r=".7"><stop offset="0" stop-color="#f4b552"/><stop offset=".5" stop-color="#a8611c"/><stop offset="1" stop-color="#4f260b"/></radialGradient>
          <linearGradient id="bgo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d998"/><stop offset=".5" stop-color="#c9a24f"/><stop offset="1" stop-color="#8f6a26"/></linearGradient>
          <linearGradient id="bf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e0561a"/><stop offset=".45" stop-color="#ffb02e"/><stop offset="1" stop-color="#fff1c2"/></linearGradient>
        </defs>
        <!-- warm glow -->
        <circle class="halo" cx="40" cy="76" r="42" fill="url(#bh)"/>
        <!-- chain + ring -->
        <path d="M40 0 V15" stroke="#c9a24f" stroke-width="1.2" stroke-dasharray="2.4 1.6"/>
        <circle cx="40" cy="18" r="3" fill="none" stroke="#c9a24f" stroke-width="1.4"/>
        <!-- dome with a little crescent finial -->
        <path d="M40 21 v4" stroke="#c9a24f" stroke-width="1.6"/>
        <path d="M26 44 Q27 30 40 25 Q53 30 54 44 Z" fill="url(#bgo)"/>
        <path d="M30 41 Q32 32 40 28.6" fill="none" stroke="#fff3cf" stroke-opacity=".5" stroke-width="1"/>
        <rect x="22" y="43.5" width="36" height="5" rx="1.4" fill="url(#bgo)"/>
        <!-- glass body (lit from inside) -->
        <path class="glass" d="M24 48.5 H56 L60 92 H20 Z" fill="url(#bg)"/>
        <!-- flame -->
        <g class="fl">
          <path d="M40 57 C47 66 47.6 75 40 81 C32.4 75 33 66 40 57 Z" fill="url(#bf)"/>
        </g>
        <g class="fl2">
          <path d="M40 66 C43.6 71 43.8 76 40 79.4 C36.2 76 36.4 71 40 66 Z" fill="#fff8e0"/>
        </g>
        <rect x="36" y="80.6" width="8" height="5" rx="1" fill="#f5ead2"/>
        <!-- frame: pointed-arch windows + bars -->
        <g fill="none" stroke="#c9a24f" stroke-width="1.6" stroke-linejoin="round">
          <path d="M24 48.5 H56 L60 92 H20 Z"/>
          <path d="M33.4 48.5 L31.6 92 M46.6 48.5 L48.4 92" stroke-width="1.2"/>
          <path d="M26.6 90 V62 Q28.6 55 30.4 52.6 Q32 55 32.2 62 V90" stroke-width=".9" opacity=".75"/>
          <path d="M53.4 90 V62 Q51.4 55 49.6 52.6 Q48 55 47.8 62 V90" stroke-width=".9" opacity=".75"/>
        </g>
        <!-- base -->
        <rect x="18" y="91.5" width="44" height="5" rx="1.4" fill="url(#bgo)"/>
        <path d="M24 96.5 H56 L48 107 H32 Z" fill="url(#bgo)"/>
        <path d="M40 107 v5" stroke="#c9a24f" stroke-width="1.6"/>
        <circle cx="40" cy="114.5" r="2.6" fill="#c9a24f"/>
        <path d="M40 117 l-1.6 7 h3.2 Z" fill="#a8213b"/>
      </svg>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
